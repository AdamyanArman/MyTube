{% extends 'base.html' %}
{% load static %}

{% block content %}
    <a href="javascript:history.back()">← Go Back</a>
    <form action="{% url 'login' %}" method="POST" id="register-login-form">
        {% csrf_token %}
        <h2 style="margin: 15px auto;">Login</h2>
        <input class="login-password" type="text" name="phone" placeholder="+37400000000">
        <input class="login-password" type="password" name="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>




{% endblock %}
